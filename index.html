<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f6ef">
<title>오누 · 차량 앱 시연</title>
<style>
:root{color-scheme:light;--paper:#f8f6ef;--ink:#183e39;--muted:#486058;--rule:#cad2c7;--link:#1e5249}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55;word-break:keep-all}
main{width:calc(100% - clamp(32px,7vw,104px));max-width:min(1176px,max(820px,148vh));margin:auto;padding:clamp(20px,3.5vh,42px) 0 36px}
header{display:flex;align-items:center;gap:clamp(14px,2.6vw,32px);margin-bottom:clamp(15px,2.6vh,28px)}
.brand{display:block;flex:none;width:clamp(64px,7.4vw,96px);height:auto}
h1{margin:0;text-wrap:balance;font-size:clamp(21px,3.1vw,39px);line-height:1.22;letter-spacing:-.065em;font-weight:730}
figure{margin:0}.stage{overflow:hidden;border-radius:clamp(7px,1.2vw,15px);background:#173831;box-shadow:0 1px 1px #213e3026}
video{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#172823}
.actions{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding:10px 0 8px;border-bottom:1px solid var(--rule)}
.formats,.materials{display:flex;align-items:center;gap:2px 14px;flex-wrap:wrap}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:4px}a:hover{text-decoration-thickness:2px}
.actions a,.actions button{min-height:44px;display:inline-flex;align-items:center}
button{background:transparent;color:var(--ink);font:inherit;padding:2px 11px;border:1px solid #8ca397;border-radius:6px;cursor:pointer}button:hover{background:#e9eee5}
.actions{font-size:.94rem}.materials{font-weight:650}.note,.status{font-size:.9rem;color:var(--muted);margin:11px 0 0}.status:not(:empty){color:#8c3524}
.actions [hidden]{display:none}
:focus-visible{outline:3px solid #b75823;outline-offset:4px}video:focus-visible{outline-offset:-4px}video::cue{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
@media(max-width:560px){main{width:calc(100% - 28px);padding:18px 0 24px}header{align-items:center;gap:13px}.brand{width:58px}h1{font-size:clamp(19px,5.5vw,25px)}.actions{gap:0 14px;align-items:flex-start}.formats,.materials{gap:0 12px}.note{line-height:1.65}.actions a,.actions button{min-height:44px}}
@media(prefers-contrast:more){:root{--muted:#253f36;--rule:#546a5d}button{border-color:currentColor}}
</style>
</head>
