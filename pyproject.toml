[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "car-playmate-prototype"
version = "0.1.0"
description = "Korean audio adventure prototype: deterministic game, recoverable API, vehicle client seam"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["services/api"]
include = ["carplay*"]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "apps/vehicle/.gradle", "apps/vehicle/build"]

[tool.ruff.lint]
select = ["F"]
